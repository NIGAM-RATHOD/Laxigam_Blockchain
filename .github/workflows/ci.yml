name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Smart contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat compile
      - run: npx hardhat test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: pip install fastapi==0.115.0 httpx==0.27.2 python-dotenv==1.0.1 asyncpg==0.29.0 web3==7.2.0 eth-account==0.13.3 qrcode==7.4.2 Pillow==10.4.0
      - name: API imports and routes register
        run: |
          python - <<'PY'
          from main import app
          paths = {route.path for route in app.routes}
          for required in ("/health", "/telegram/webhook", "/api/mediator/quote", "/api/mediator/withdraw/initiate"):
              assert required in paths, f"missing route {required}"
          print(f"OK - {len(paths)} routes")
          PY
