<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <meta name="color-scheme" content="dark" />

    <title>Laxigam · Game earnings. Real money.</title>
    <meta name="description" content="Laxigam is the gaming-to-bank bridge for BRICS+. Turn in-game value into LXG on Polygon and cash out to UPI, PIX, QIWI or Alipay — validated by dual AI and secured via Telegram." />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Laxigam · Game earnings. Real money." />
    <meta property="og:description" content="The gaming-to-bank bridge for BRICS+. Earn in games, hold LXG, cash out to UPI, PIX, QIWI & Alipay." />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body { background-color: #07070b; color: #f5f3ee; margin: 0; }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(600px 400px at 50% 40%, rgba(212, 175, 55, 0.12), transparent 70%), #07070b;
        z-index: 9999;
      }
      .initial-loader img {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 8px 24px rgba(212, 175, 55, 0.45));
        animation: loader-breathe 1.6s ease-in-out infinite;
      }
      .initial-loader .bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(212, 175, 55, 0.15);
      }
      .initial-loader .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #f6e27a, transparent);
        animation: loader-slide 1.1s ease-in-out infinite;
      }
      @keyframes loader-breathe { 50% { transform: scale(1.06); } }
      @keyframes loader-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img src="/logo.svg" alt="Laxigam" />
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
